name: CI (git)

on:
  push:
    paths:
      - 'git/**'
      - '.github/workflows/ci-git.yaml'
  pull_request:
    paths:
      - 'git/**'
      - '.github/workflows/ci-git.yaml'

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stage package
        run: cp git/PKGBUILD git/.SRCINFO .

      - name: CI
        uses: its-me/action.aur.ci@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
